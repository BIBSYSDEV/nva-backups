# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  cloudformation-linter:
    name: CloudFormation linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CloudFormation Linter
        uses: scottbrenner/cfn-lint-action@8affffc34dddd6937bbc37f60901f71657e20fab # v2.8.0
        with:
          version: "1.53.3"

      # Templates to lint are listed in .cfnlintrc.yaml
      - name: Run CloudFormation linter
        run: |
          cfn-lint --version
          cfn-lint
